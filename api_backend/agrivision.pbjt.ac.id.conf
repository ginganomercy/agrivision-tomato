# ==============================================================================
# AgriVision Ingress Configuration (Full-Stack: React 3D Web + FastAPI Deep Learning)
# Lokasi file di server host: /opt/priv-ingress/conf.d/agrivision.pbjt.ac.id.conf
# ==============================================================================

server {
    listen 80;
    server_name agrivision.pbjt.ac.id;

    # Resolusi DNS Dinamis Docker Swarm (Mencegah Crash Loop jika service di-redeploy)
    resolver 127.0.0.11 valid=10s;

    # Batas ukuran payload upload gambar daun (Maks 10MB)
    client_max_body_size 10M;

    # --------------------------------------------------------------------------
    # 1. Backend API Routing: /v1/ (Predict & Diagnostics)
    # --------------------------------------------------------------------------
    location /v1/ {
        set $upstream_api http://agrivision_api:8000;
        proxy_pass $upstream_api;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Hardening: Retry upstream otomatis saat rolling update agar zero-downtime
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 15s;
    }

    # --------------------------------------------------------------------------
    # 2. Backend Documentation & Health Probes (/docs, /openapi.json, /health)
    # --------------------------------------------------------------------------
    location ~ ^/(docs|openapi\.json|redoc|health) {
        set $upstream_api http://agrivision_api:8000;
        proxy_pass $upstream_api;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
    }

    # --------------------------------------------------------------------------
    # 3. Web Frontend: React 19 + Three.js WASD Physics Studio (Root & Assets)
    # --------------------------------------------------------------------------
    location / {
        set $upstream_web http://agrivision_web:80;
        proxy_pass $upstream_web;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Fail-safe retry
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 15s;
    }
}
