# ==============================================================================
# AgriVision Ingress Configuration (Tomato Leaf Disease Detection API)
# Salin file ini ke: /opt/priv-ingress/conf.d/agrivision.pbjt.ac.id.conf
# ==============================================================================

server {
    listen 80;
    server_name agrivision.pbjt.ac.id; # Ganti domain sesuai subdomain yang diarahkan di Cloudflare

    # Resolusi DNS Dinamis Docker Swarm (Mencegah Crash Loop)
    resolver 127.0.0.11 valid=10s;

    # Sangat penting: Izinkan upload gambar daun hingga 10MB
    client_max_body_size 10M;

    location / {
        # Format upstream Swarm: <nama_stack>_<nama_service>:<port>
        set $upstream_agrivision http://agrivision_api:8000;
        proxy_pass $upstream_agrivision;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeout pemrosesan inferensi Deep Learning
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Hardening: Retry upstream otomatis saat rolling update agar zero-downtime / bebas 502
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 15s;
    }
}
