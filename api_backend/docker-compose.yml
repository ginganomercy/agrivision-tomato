version: '3.8'

services:
  # Load Balancer / Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    deploy:
      placement:
        constraints:
          - node.role == manager # Nginx jalan di node manager

  # FastAPI Backend Service (Bisa digandakan/di-scale)
  api:
    image: agrivision_api:latest
    build: .
    environment:
      - ENVIRONMENT=production
      - TZ=Asia/Jakarta
      - HF_REPO=ginganomercy/agrivision-mobilenetv2
      # Token HuggingFace opsional (jika repo dibuat private)
      - HF_TOKEN=${HF_TOKEN:-} 
    volumes:
      - ./data:/app/data
    deploy:
      replicas: 3 # Docker Swarm akan menghidupkan 3 container API sekaligus
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first # Zero-downtime deployment
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 1G # Maksimal 1GB per replica (total 3GB)
