version: '3.8'

services:
  # FastAPI Deep Learning Backend (MobileNetV2)
  api:
    image: agrivision_api:latest
    build: .
    environment:
      - ENVIRONMENT=production
      - TZ=Asia/Jakarta
      - HF_REPO=ginganomercy/agrivision-mobilenetv2
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - agrivision_data:/app/data
    networks:
      - front-tier
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first # Zero-downtime rolling update
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M

volumes:
  agrivision_data:
    driver: local

networks:
  front-tier:
    external: true
