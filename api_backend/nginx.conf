events {
    worker_connections 1024;
}

http {
    upstream fastapi_cluster {
        # 'api' adalah nama service di docker-compose. Docker Swarm DNS akan
        # melakukan Round-Robin Load Balancing ke 3 replica kita secara otomatis.
        server api:8000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://fastapi_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Sangat penting untuk upload gambar (Maksimal file 10MB)
            client_max_body_size 10M;
        }
    }
}
