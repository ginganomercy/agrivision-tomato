name: 🚀 AgriVision CI/CD Pipeline (Build, Test & Deploy)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # =========================================================================
  # STAGE 1: 🧪 Automated Testing & Code Quality Gate
  # =========================================================================
  test:
    name: 🧪 Run Automated Tests & Flake8 Linter
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 📦 Install Testing & ML Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r api_backend/requirements.txt
          pip install flake8 pytest httpx pytest-mock

      - name: 🔍 Static Code Analysis (Flake8)
        run: |
          # Hentikan pipeline jika ada syntax errors atau undefined names (E9, F63, F7, F82)
          flake8 api_backend/src api_backend/tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 🧪 Execute Unit & Integration Test Suite (Pytest)
        run: |
          pytest api_backend/tests -v --tb=short

  # =========================================================================
  # STAGE 2: 🐳 Docker Container Build & Artifact Verification
  # =========================================================================
  build:
    name: 🐳 Verify Docker Build & Container Integrity
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker Image (Dry-Run / Cache Validation)
        uses: docker/build-push-action@v5
        with:
          context: api_backend
          file: api_backend/Dockerfile
          push: false
          tags: agrivision_api:validation
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # STAGE 3: 🚢 Zero-Downtime Deployment to Bare-Metal Server (Docker Swarm)
  # =========================================================================
  deploy:
    name: 🚢 Deploy to Bare-Metal Server (Docker Swarm)
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_TAILSCALE: ${{ secrets.TAILSCALE_AUTHKEY != '' }}
    steps:
      - name: 🌐 Connect to Tailscale Network
        if: env.HAS_TAILSCALE == 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: 🔐 Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USER || secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SERVER_SSH_KEY }}
          port: ${{ vars.SERVER_PORT || secrets.SERVER_PORT || '22' }}
          script_stop: true
          script: |
            set -e

            # 1. Bersihkan variabel dari karakter newline/CRLF bawaan Windows
            RAW_DIR="${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/opt/agrivision-tomato' }}"
            DEPLOY_DIR=$(echo "$RAW_DIR" | tr -d '\r\n ' | sed 's:/*$::')
            DEPLOY_DIR="${DEPLOY_DIR:-/opt/agrivision-tomato}"
            
            REPO_URL="https://github.com/ginganomercy/agrivision-tomato.git"
            export HF_TOKEN=$(echo "${{ secrets.HF_TOKEN }}" | tr -d '\r\n ')

            echo "=========================================="
            echo "🚀 Starting AgriVision Deployment on Bare-Metal"
            echo "Target Directory: $DEPLOY_DIR"
            echo "=========================================="

            # 2. Sinkronisasi Git secara fail-safe & self-healing
            if [ "$EUID" -ne 0 ]; then
              sudo mkdir -p "$DEPLOY_DIR"
              sudo chown -R $USER:$USER "$DEPLOY_DIR"
            else
              mkdir -p "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"
            git config --global --add safe.directory "$DEPLOY_DIR" || true

            if [ ! -d ".git" ]; then
              echo "[INFO] Menginisialisasi Git repository..."
              git init
            fi

            if git remote | grep -q "^origin$"; then
              git remote set-url origin "$REPO_URL"
            else
              git remote add origin "$REPO_URL"
            fi

            echo "[INFO] Menarik commit terbaru dari GitHub..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # 3. Pindah ke direktori api_backend
            cd "$DEPLOY_DIR/api_backend"

            # 4. Pastikan Docker Swarm aktif
            if ! docker info --format '{{.Swarm.LocalNodeState}}' | grep -q "active"; then
              echo "[INFO] Menginisialisasi Docker Swarm..."
              docker swarm init || true
            fi

            # 5. Pastikan network front-tier ada
            if ! docker network inspect front-tier >/dev/null 2>&1; then
              echo "[INFO] Membuat overlay network front-tier..."
              docker network create --driver overlay --attachable front-tier
            fi

            # 6. Build Docker image API dengan dependensi CPU PyTorch terbaru
            echo "[INFO] Membangun image Docker API..."
            docker build -t agrivision_api:latest .

            # 7. Deploy Stack ke Docker Swarm
            echo "[INFO] Menerapkan stack agrivision ke Docker Swarm..."
            docker stack deploy -c docker-compose.yml agrivision

            # 8. Loop Verifikasi Kesiapan (Readiness Probe)
            echo "[INFO] Menunggu service aktif dan melewati healthcheck..."
            for i in $(seq 1 12); do
              RUNNING_COUNT=$(docker service ls --filter name=agrivision_api --format '{{.Replicas}}' | cut -d'/' -f1 || echo "0")
              if [ "$RUNNING_COUNT" = "2" ]; then
                echo "[INFO] Sukses: 2/2 Replicas sudah Running dan Healthy!"
                break
              fi
              echo "[WAIT] Menunggu replika siap ($i/12)..."
              sleep 5
            done

            docker service ps agrivision_api || true
            docker service logs --tail 30 agrivision_api || true

            # 9. Sinkronisasi konfigurasi Ingress ke /opt/priv-ingress/conf.d jika direktori ada
            if [ -d "/opt/priv-ingress/conf.d" ]; then
              echo "[INFO] Menyinkronkan konfigurasi Ingress ke /opt/priv-ingress/conf.d/..."
              if [ "$EUID" -ne 0 ]; then
                sudo cp -f agrivision.pbjt.ac.id.conf /opt/priv-ingress/conf.d/
                sudo chmod 644 /opt/priv-ingress/conf.d/agrivision.pbjt.ac.id.conf
              else
                cp -f agrivision.pbjt.ac.id.conf /opt/priv-ingress/conf.d/
                chmod 644 /opt/priv-ingress/conf.d/agrivision.pbjt.ac.id.conf
              fi

              INGRESS_ID=$(docker ps -q -f name=priv-ingress_nginx | head -n 1)
              if [ -n "$INGRESS_ID" ]; then
                echo "[INFO] Memverifikasi sintaks Nginx Ingress..."
                docker exec "$INGRESS_ID" nginx -t || sudo docker exec "$INGRESS_ID" nginx -t || true
                echo "[INFO] Me-reload Nginx Ingress..."
                docker exec "$INGRESS_ID" nginx -s reload || sudo docker exec "$INGRESS_ID" nginx -s reload || true
              fi
            fi

            echo "=========================================="
            echo "✅ Deployment Sukses!"
            echo "=========================================="
            docker service ls
